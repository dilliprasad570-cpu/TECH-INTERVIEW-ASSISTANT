services:
  - type: web
    name: ai-interview-assistant
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --chdir backend app:app --workers 1 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: NVIDIA_API_KEY
        sync: false
      - key: NVIDIA_MODEL
        value: nvidia/nemotron-3-nano-omni-30b-a3b-reasoning
      - key: GOOGLE_API_KEY
        sync: false
      - key: MURF_API_KEY
        sync: false
      - key: ASSEMBLYAI_API_KEY
        sync: false
